version: '3.8'

services:

  notifications-api:
    build: .
    command: sh -c "npm run dev"
    ports:
      - "3032:3001"
    env_file:
      - ./.env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - dev-infra

  notifications-consumer:
    build: .
    command: sh -c "node src/consumer/index.js"
    env_file:
      - ./.env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - dev-infra

networks:
  dev-infra:
    external: true